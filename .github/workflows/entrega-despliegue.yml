name: Entrega y despliegue continuo
on:
  workflow_run:
    workflows: [Integración continua]
    types: [completed]
    branches: [main, dev]
permissions:
  contents: read
concurrency:
  group: entrega-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  images:
    name: Publicar imagen (${{ matrix.service }})
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: backend
            file: backend/Dockerfile
          - service: web
            context: .
            file: infra/frontend.Dockerfile
          - service: chatbot
            context: chatbot
            file: chatbot/Dockerfile
    steps:
      - name: Obtener el commit que aprobó CI
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Definir imagen y versión
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          name="ghcr.io/${REPOSITORY,,}/$SERVICE"
          echo "tags=$name:$SHA,$name:$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Preparar constructor
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Autenticar publicación en GitHub Packages
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar la imagen verificada
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
  deploy:
    name: Desplegar producción por SSH
    needs: images
    if: github.event.workflow_run.head_branch == 'main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: produccion
    steps:
      - name: Obtener herramientas del commit aprobado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Verificar configuración y desplegar por SSH
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/deploy-ssh.sh
