server {
    listen ${PORT};
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;
    resolver 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; frame-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;

    location /api/ {
        set $api_origin https://${API_HOST};
        proxy_pass $api_origin$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name ${API_HOST};
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host ${API_HOST};
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /chat/ {
        set $chat_origin https://${CHATBOT_HOST};
        proxy_pass $chat_origin$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name ${CHATBOT_HOST};
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host ${CHATBOT_HOST};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    }

    location = /ngsw.json {
        expires -1;
    }

    location = /index.html {
        expires -1;
    }
}
