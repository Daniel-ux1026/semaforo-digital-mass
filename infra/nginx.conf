server {
 listen 80;
 server_tokens off;
 absolute_redirect off;
 root /usr/share/nginx/html;
 client_max_body_size 32k;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; frame-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
 location /api/ { proxy_pass http://api:8080; proxy_read_timeout 15s; proxy_set_header Host $host; }
 location / { try_files $uri $uri/ /index.html; }
 location = /ngsw.json { expires -1; }
 location = /index.html { expires -1; }
 location /chat/ {
  proxy_pass http://chatbot:8501;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_read_timeout 120s;
  add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
 }
}
