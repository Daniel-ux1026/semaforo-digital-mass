name: semaforo
services:
  mysql:
    image: mysql:8.4.8
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure .env}
      MYSQL_DATABASE: semaforo
      MYSQL_USER: semaforo
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configure .env}
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.40.7
    ports: ["127.0.0.1:5678:5678"]
    environment:
      TZ: America/Lima
      GENERIC_TIMEZONE: America/Lima
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Configure .env}
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
    volumes: ["n8n_data:/home/node/.n8n"]
    restart: unless-stopped
  api:
    restart: unless-stopped
    profiles: [full]
    build: ../backend
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:mysql://mysql:3306/semaforo?connectionTimeZone=UTC
      DB_USER: semaforo
      DB_PASSWORD: ${DB_PASSWORD}
      MIGRATION_USER: ${MIGRATION_USER:-semaforo}
      MIGRATION_PASSWORD: ${MIGRATION_PASSWORD:-${DB_PASSWORD}}
      JWT_SECRET: ${JWT_SECRET}
      BOOTSTRAP_DNI: ${BOOTSTRAP_DNI}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD}
      N8N_URL: http://n8n:5678/webhook/semaforo-events
      N8N_CHAT_URL: http://n8n:5678/webhook/semaforo-chat
      N8N_TOKEN: ${N8N_TOKEN}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4200}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    depends_on:
      mysql:
        condition: service_healthy
    ports: ["127.0.0.1:8080:8080"]
  web:
    restart: unless-stopped
    profiles: [full]
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
    ports: ["127.0.0.1:4200:80"]
    depends_on: [api, chatbot]
  chatbot:
    profiles: [full]
    restart: unless-stopped
    build: ../chatbot
    environment:
      BACKEND_URL: http://api:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    depends_on: [api]
volumes:
  mysql_data:
  n8n_data:
